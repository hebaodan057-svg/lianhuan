name: verify
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - name: Python contracts
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
      - name: Frontend and release checks
        run: |
          set -euo pipefail
          python tools/checkhtml.py
          # ★ 两份不再要求逐字节相同：安卓那份必须去掉 viewport-fit=cover
          #   （否则 Chromium 走 passthrough 缩放，键盘处理全部失效 ——
          #    Capacitor #8622，同机型同 WebView 版本）。
          #   除这一处之外，其余必须完全一致。
          python -c "
import sys
web = open('core/web/index.html', encoding='utf-8').read()
android = open('app/index.html', encoding='utf-8').read()
if 'viewport-fit=cover' in android:
    sys.exit('✗ 安卓那份必须去掉 viewport-fit=cover')
if android != web.replace('viewport-fit=cover, ', '', 1):
    sys.exit('✗ 两份前端漂开了（除 viewport-fit=cover 之外还有别的差异）')
print('✓ 两份只差 viewport-fit=cover')
" 
          npm test
          npm run build
          npm run check:privacy
          python tools/preflight.py
      - name: 隐私闸（仓库本身）
        uses: ./.github/actions/privacy-gate
        with: { markers: '${{ secrets.LIANHUAN_PRIVATE_MARKERS }}' }
      - name: Clean generated copy
        run: |
          set -euo pipefail
          out="$(mktemp -d)/lianhuan"
          python create.py --yes "$out"
          echo "CLEAN_COPY=$out" >> "$GITHUB_ENV"
          cd "$out"
          python -m unittest discover -s tests -v
      - name: 隐私闸（create.py 产出的那一份 —— 真正会发出去的东西）
        uses: ./.github/actions/privacy-gate
        with:
          root: ${{ env.CLEAN_COPY }}
          markers: ${{ secrets.LIANHUAN_PRIVATE_MARKERS }}
